
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آماده‌سازی کارنامه | محیط آموزشی</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fa;
            font-family: "Vazirmatn", Tahoma, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #26364b;
        }

        .demo-banner {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            padding: 10px;
            text-align: center;
            background: #fff3cd;
            color: #795b00;
            border-bottom: 1px solid #ead99a;
            font-size: 12px;
            font-weight: 700;
        }

        .loading-box {
            width: min(90%, 430px);
            text-align: center;
            padding: 45px 25px;
            background: #fff;
            border: 1px solid #e7ebf1;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(30, 50, 80, .07);
        }

        .logo {
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(145deg, #eaf2ff, #d5e5ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2850bd;
            font-size: 38px;
            font-weight: 800;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(40, 80, 189, .12);
            }

            50% {
                transform: scale(1.13);
                box-shadow: 0 0 0 15px rgba(40, 80, 189, 0);
            }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
            font-weight: 800;
        }

        .description {
            color: #8290a2;
            font-size: 13px;
            line-height: 2;
            margin-bottom: 25px;
        }

        .countdown {
            font-size: 34px;
            font-weight: 800;
            color: #2850bd;
            direction: ltr;
            margin-bottom: 20px;
        }

        .progress {
            height: 6px;
            background: #edf1f7;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: #2850bd;
            border-radius: 20px;
            animation: progress 20s linear forwards;
        }

        @keyframes progress {
            from { width: 100%; }
            to { width: 0%; }
        }

        .note {
            margin-top: 22px;
            font-size: 10px;
            color: #9aa5b5;
        }
    </style>
</head>

<body>

    

    <main class="loading-box">

        <div class="logo">آماده سازی</div>

        <h1>لطفاً صبر کنید...</h1>

        <div class="description">
            در حال آماده‌سازی اطلاعات کارنامه هستیم.
            لطفاً تا پایان شمارش معکوس منتظر بمانید.
        </div>

        <div class="countdown" id="timer">10</div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        

    </main>

    <script>
        let remaining = 20;

        const timer = document.getElementById("timer");

        const countdown = setInterval(function () {
            remaining--;

            timer.textContent = remaining;

            if (remaining <= 0) {
                clearInterval(countdown);
                window.location.href = "final-report-list.html";
            }

        }, 1000);
    </script>

</body>
</html>
